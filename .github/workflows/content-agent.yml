name: Content agent

on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC daily — after growth agent
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no commits)"
        required: false
        default: "false"

concurrency:
  group: sill-bot-commit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  content:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: "549929269"
      GSC_SITE_URL: "sc-domain:sillgarden.com"
      GOOGLE_AUTH: oauth
      AUTOMATION_LIVE: "1"
      PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "37b02453651a4e74cc1eaed7241a6338"
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_USER_TOKEN_JSON: ${{ secrets.GOOGLE_USER_TOKEN_JSON }}
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-analytics.txt
      - name: Content agent (research → refresh + new)
        run: |
          EXTRA="--refresh"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          python scripts/content_agent.py $EXTRA
      - name: Commit and push changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci_git_push.sh "chore: content agent $(date -u +%Y-%m-%d)" \
            src/content/guides/ products/growth/content-agent/ products/analytics/
