name: YouTube build and upload

on:
  schedule:
    # Prepare the next approved storyboard each Friday; uploads stay unlisted for review.
    - cron: "0 14 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and preview metadata without uploading"
        type: boolean
        default: true
      privacy:
        description: "Upload visibility"
        type: choice
        options:
          - unlisted
          - private
          - public
        default: unlisted

concurrency:
  group: sill-bot-commit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_USER_TOKEN_JSON: ${{ secrets.YOUTUBE_USER_TOKEN_JSON }}
      YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-youtube.txt
      - name: Install video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          pip install -r requirements-youtube.txt
      - name: Verify Sill Garden channel access
        id: gate
        run: python scripts/youtube_access_gate.py
      - name: Build and upload next storyboard
        run: |
          EXTRA=""
          PRIVACY="${{ github.event.inputs.privacy || 'unlisted' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python scripts/youtube_auto_publish.py --privacy "$PRIVACY" $EXTRA
      - name: Commit publish status
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/youtube/publish-state.json products/youtube/youtube-access-status.json
          git diff --cached --quiet || git commit -m "chore: record YouTube upload"
          git push
