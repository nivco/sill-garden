name: YouTube build and upload

on:
  schedule:
    # Daily 14:00 UTC — one long-form video
    - cron: "0 14 * * *"
    # Daily 09:00 UTC — one Short
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and preview metadata without uploading"
        type: boolean
        default: false
      privacy:
        description: "Upload visibility"
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public
      force:
        description: "Ignore interval / daily cap"
        type: boolean
        default: false

concurrency:
  group: sill-bot-commit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_LIVE: "1"
      YOUTUBE_USER_TOKEN_JSON: ${{ secrets.YOUTUBE_USER_TOKEN_JSON }}
      YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-youtube.txt
      - name: Install video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          pip install -r requirements-youtube.txt
      - name: Verify Sill Garden channel access
        id: gate
        run: python scripts/youtube_access_gate.py
      - name: Plan next videos
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: |
          python scripts/youtube_planner.py --write
          python scripts/youtube_planner.py --write-short
      - name: Build and upload next long-form video
        if: steps.gate.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * *')
        run: |
          EXTRA=""
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then EXTRA="$EXTRA --force"; fi
          python scripts/youtube_auto_publish.py --privacy "$PRIVACY" $EXTRA
      - name: Build and upload next Short
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.dry_run != 'true' && (github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          EXTRA=""
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then EXTRA="$EXTRA --force"; fi
          python scripts/youtube_auto_publish.py --short-slot --privacy "$PRIVACY" $EXTRA
      - name: Commit publish status
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci_git_push.sh "chore: record YouTube upload $(date -u +%Y-%m-%d)" \
            products/youtube/
