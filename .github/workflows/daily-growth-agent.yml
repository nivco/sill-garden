name: Daily growth agent

on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no commits/email)"
        required: false
        default: "false"

concurrency:
  group: sill-bot-commit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: "549929269"
      GSC_SITE_URL: "sc-domain:sillgarden.com"
      GOOGLE_AUTH: oauth
      AUTOMATION_LIVE: "1"
      PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      GROWTH_REPORT_EMAIL: ${{ secrets.GROWTH_REPORT_EMAIL }}
      GROWTH_SMTP_HOST: ${{ secrets.GROWTH_SMTP_HOST }}
      GROWTH_SMTP_USER: ${{ secrets.GROWTH_SMTP_USER }}
      GROWTH_SMTP_PASS: ${{ secrets.GROWTH_SMTP_PASS }}
      GROWTH_SMTP_PORT: ${{ secrets.GROWTH_SMTP_PORT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: "37b02453651a4e74cc1eaed7241a6338"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_HANDLE: ${{ secrets.YOUTUBE_CHANNEL_HANDLE }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_USER_TOKEN_JSON: ${{ secrets.GOOGLE_USER_TOKEN_JSON }}
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-analytics.txt
      - name: Measurement gate (warn only)
        run: python scripts/measurement_gate.py --warn-only
      - name: Daily growth agent
        run: |
          EXTRA="--refresh"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          python scripts/daily_growth_agent.py $EXTRA
      - name: Commit growth outputs
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci_git_push.sh "chore: daily growth agent $(date -u +%Y-%m-%d)" \
            src/content/guides/ \
            products/growth/ \
            products/analytics/ \
            products/traffic/ \
            reports/board/
