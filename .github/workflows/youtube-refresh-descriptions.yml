name: YouTube refresh descriptions

on:
  schedule:
    # After YouTube daily quota reset (~00:00 America/Los_Angeles ≈ 07:00 UTC)
    - cron: "30 7 * * *"
    # Weekly catch-up (Monday afternoon UTC)
    - cron: "20 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview metadata without updating YouTube"
        type: boolean
        default: false

concurrency:
  group: sill-youtube-metadata-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_LIVE: "1"
      YOUTUBE_USER_TOKEN_JSON: ${{ secrets.YOUTUBE_USER_TOKEN_JSON }}
      YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-youtube.txt
      - name: Install YouTube dependencies
        run: pip install -r requirements-youtube.txt
      - name: Verify Sill Garden channel access
        id: gate
        run: python scripts/youtube_access_gate.py --warn-only
      - name: Refresh descriptions and tags
        if: steps.gate.outputs.ready == 'true'
        run: |
          EXTRA=""
          # schedule + AUTOMATION_LIVE=0 must dry-run or the job fails
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || \
             { [ "${{ github.event_name }}" = "schedule" ] && [ "$AUTOMATION_LIVE" != "1" ]; }; then
            EXTRA="--dry-run"
          fi
          python scripts/youtube_refresh_descriptions.py $EXTRA
      - name: Post kit-link comments on top Shorts
        if: steps.gate.outputs.ready == 'true'
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || \
             { [ "${{ github.event_name }}" = "schedule" ] && [ "$AUTOMATION_LIVE" != "1" ]; }; then
            EXTRA="--dry-run"
          fi
          python scripts/youtube_post_kit_comments.py --limit 8 $EXTRA
      - name: Skip note when gate not ready
        if: steps.gate.outputs.ready != 'true'
        run: echo "YouTube gate not ready (auth or daily quota). Daily 07:30 UTC cron will retry after quota reset."
      - name: Commit publish / OAuth status
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci_git_push.sh "chore: record YouTube metadata refresh" \
            products/youtube/publish-state.json \
            products/youtube/youtube-access-status.json || true