name: YouTube refresh descriptions

on:
  schedule:
    - cron: "20 13 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview metadata without updating YouTube"
        type: boolean
        default: true

concurrency:
  group: sill-youtube-metadata-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_LIVE: ${{ vars.AUTOMATION_LIVE || '0' }}
      YOUTUBE_USER_TOKEN_JSON: ${{ secrets.YOUTUBE_USER_TOKEN_JSON }}
      YOUTUBE_OAUTH_CLIENT_JSON: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-youtube.txt
      - name: Install YouTube dependencies
        run: pip install -r requirements-youtube.txt
      - name: Verify Sill Garden channel access
        run: python scripts/youtube_access_gate.py
      - name: Refresh descriptions and tags
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python scripts/youtube_refresh_descriptions.py $EXTRA
      - name: Commit publish state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/youtube/publish-state.json
          git diff --cached --quiet || git commit -m "chore: record YouTube metadata refresh"
          git push
