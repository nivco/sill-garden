name: Traffic optimizer loop

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours UTC
  workflow_dispatch:

concurrency:
  group: sill-bot-commit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: "549929269"
      GSC_SITE_URL: "sc-domain:sillgarden.com"
      GOOGLE_AUTH: oauth
      PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
      CLOUDFLARE_ZONE_ID: "37b02453651a4e74cc1eaed7241a6338"
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-analytics.txt
      - name: Probe Google access
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_USER_TOKEN_JSON: ${{ secrets.GOOGLE_USER_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: python scripts/check_google_access.py
      - name: Refresh analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_HANDLE: ${{ secrets.YOUTUBE_CHANNEL_HANDLE }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_USER_TOKEN_JSON: ${{ secrets.GOOGLE_USER_TOKEN_JSON }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: python scripts/analytics_summary.py
      - name: Measurement gate (warn only)
        run: python scripts/measurement_gate.py --warn-only
      - name: Traffic optimizer
        run: python scripts/traffic_optimizer.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci_git_push.sh "chore: traffic optimizer scorecard" \
            products/analytics/ products/traffic/
